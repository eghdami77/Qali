<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>حل مساله گره های قالی</title>
<style>
:root{color-scheme:light only;--red:#c8362a;--cream:#f1dfb0;--teal:#3f8a86;--ora:#e8743b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:Tahoma,"Vazirmatn",Arial,sans-serif;color:#222;min-height:100vh;padding:14px 10px 24px;
background-color:#f1dfb0;
background-image:
radial-gradient(circle at 50% 50%,#f1dfb0 0 18%,transparent 19%),
conic-gradient(var(--red) 0 25%,var(--teal) 0 50%,var(--red) 0 75%,var(--teal) 0);
background-size:44px 44px,44px 44px;background-attachment:fixed}
.canvas{max-width:640px;margin:0 auto;background:#fff;border-radius:18px;border:4px solid var(--red);box-shadow:0 0 0 4px var(--cream),0 8px 24px rgba(0,0,0,.35);padding:18px 14px 14px;min-height:80vh}
h1{margin:0 0 8px;text-align:center;font-size:1.45rem;color:var(--red);line-height:1.6}
.page{display:none}.page.on{display:block}
.rug{display:block;width:min(70%,300px);margin:6px auto 12px;pointer-events:none;animation:fl 5s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-7px) rotate(1.5deg)}}
.btn{display:block;width:100%;max-width:340px;margin:10px auto;padding:13px;border:0;border-radius:14px;font:inherit;font-size:1.1rem;font-weight:bold;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .15s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.b1{background:var(--red)}.b2{background:var(--teal)}
.gr{background:#7d7d7d;font-size:.95rem;padding:10px;max-width:340px}
.row{display:flex;gap:8px;max-width:340px;margin:6px auto}.row .btn{margin:0}
.back{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(90deg,var(--ora),var(--red),var(--ora));background-size:200% 100%;animation:sh 2.5s linear infinite;color:#fff;border:0;border-radius:30px;padding:10px 18px;font:inherit;font-weight:bold;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.3);margin-bottom:10px}
.back span{display:inline-block;animation:arr 1s ease-in-out infinite;font-size:1.2rem}
@keyframes sh{to{background-position:200% 0}}
@keyframes arr{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
.out{line-height:2.1;font-size:1.02rem}
.out .l{margin:6px 0;opacity:1}
.out .t{color:var(--teal);font-weight:bold;font-size:1.1rem}
.out .why{background:#fdf3d6;border-right:4px solid var(--ora);padding:6px 10px;border-radius:8px}
.out .q{background:#f7f7f7;border:1px solid #ddd;border-radius:10px;padding:8px 10px}
.out .ans{background:#e4f3f1;border:2px solid var(--teal);border-radius:10px;padding:6px 10px;font-weight:bold}
.out math{font-size:1.2em}
.m{direction:ltr;text-align:center;overflow-x:auto;animation:fi .6s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.foot{margin-top:18px;text-align:center;direction:ltr;font-weight:bold;color:var(--red)}
</style>
</head>

function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
async function play(id,arr){
  var id0=++run,box=document.getElementById(id);box.innerHTML='';
  for(var i=0;i<arr.length;i++){
    if(id0!==run)return;
    var s=arr[i],d;
    if(s[0]==='m'){box.insertAdjacentHTML('beforeend',s[1]);}
    else{
      d=document.createElement('div');d.className='l '+(s[0]==='l'?'':s[0]==='w'?'why':s[0]);box.appendChild(d);
      for(var k=1;k<=s[1].length;k++){if(id0!==run)return;d.textContent=s[1].slice(0,k);await sleep(22)}
    }
    window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
    await sleep(1000);
  }
}
function go(p){
  run++;
  ['home','stat','sol'].forEach(function(x){document.getElementById(x).classList.toggle('on',x===p)});
  window.scrollTo(0,0);
  if(p==='stat')play('o1',STAT);
  if(p==='sol')play('o2',SOL);
}
function toggleMusic(){
  var a=document.getElementById('au'),b=document.getElementById('mus');
  if(a.paused){a.play().then(function(){b.textContent='⏸ توقف آهنگ'}).catch(function(){b.textContent='▶ پخش آهنگ'})}
  else{a.pause();b.textContent='▶ پخش آهنگ'}
}
function clearAll(){
  run++;document.getElementById('o1').innerHTML='';document.getElementById('o2').innerHTML='';
  var a=document.getElementById('au');a.pause();a.currentTime=0;document.getElementById('mus').textContent='▶ پخش آهنگ';
}
</script>
